<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>201款游戏 · 配色对照</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f2;color:#243a3c;font:15px/1.7 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1500px;margin:auto;padding:36px 24px}a{color:#24675c}h1{font-size:30px;margin-bottom:8px}.intro{max-width:860px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}.card{background:white;border:1px solid #d7e0d9;border-radius:12px;overflow:hidden}.pictures{height:180px;display:flex;background:#e5e8e5;gap:3px;justify-content:center}.pictures img{min-width:0;max-width:100%;height:100%;object-fit:contain}.swatch{padding:12px 16px;min-height:90px}.swatch h3{font-size:16px;margin:0 0 5px}.meta{padding:10px 16px;font-size:12px}.meta p{margin:6px 0}.meta a{display:inline-block;margin-right:12px}code{font:13px monospace}h2{margin-top:36px}input{width:min(100%,420px);padding:12px;border:1px solid #bbcfc2;border-radius:8px;margin:16px 0}section[hidden],article[hidden]{display:none}
</style></head><body><main><a href="index.html">← 返回分析台</a><h1>逐项对照游戏与底板颜色</h1><p class="intro">底板色来自各项列出的实际参考图，取色区域与方法可在详情中核对。它是当前图片的代表色，不表示游戏所有场景或所有角色只有一种颜色。原案例的设定与宣传图按全图取色；休闲游戏商店图裁去顶部文案和四周边框。文字使用黑白自适应，保证至少4.5:1的对比度。</p><label>搜索游戏 <input id="filter" type="search" placeholder="输入名称或编号"></label><div id="content"></div></main><script src="assets/js/data.js"></script><script src="assets/js/art-explorer-core.js"></script><script>
const esc=ArtExplorer.esc;const content=document.getElementById('content');
for(const key of ['games','casual']){const ds=DATA.datasets[key],section=document.createElement('section');section.innerHTML=`<h2>${esc(ds.name)} · ${ds.items.length}款</h2><div class="grid">${ds.items.map(g=>{const p=g.labelPalette,c=ArtExplorer.labelColors(g);return `<article class="card" data-name="${esc((g.code+' '+g.name).toLowerCase())}"><div class="pictures">${p.sources.map(s=>`<img loading="lazy" src="${esc(s.image)}" alt="${esc(g.name)}取色参考">`).join('')}</div><div class="swatch" style="background:${c.fill};color:${c.ink}"><h3>${esc(g.code)} ${esc(g.name)}</h3><code>${c.fill}</code> · 文字对比度 ${c.contrast.toFixed(2)}:1</div><div class="meta"><details><summary>取色说明与来源</summary><p>${esc(p.note)}</p>${p.sources.map((s,i)=>`<p><a href="${esc(s.image)}" target="_blank" rel="noopener">参考图${i+1}</a><a href="${esc(s.page||s.url)}" target="_blank" rel="noopener">来源页面 ↗</a><br>取色区域：左${s.crop.left} / 上${s.crop.top} / 宽${s.crop.width} / 高${s.crop.height}px</p>`).join('')}</details></div></article>`;}).join('')}</div>`;content.append(section);}
document.getElementById('filter').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();document.querySelectorAll('.card').forEach(el=>el.hidden=!el.dataset.name.includes(q));});
</script></body></html>
